<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Đang tải bài viết...</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* CSS tuỳ chỉnh cho nội dung do AI tạo */
        .prose h1 { font-size: 2.25rem; font-weight: bold; margin-bottom: 1.5rem; color: #111827; line-height: 1.2; }
        .prose h2 { font-size: 1.875rem; font-weight: bold; margin-top: 2.5rem; margin-bottom: 1rem; color: #1f2937; }
        .prose h3 { font-size: 1.5rem; font-weight: bold; margin-top: 2rem; margin-bottom: 0.75rem; color: #374151; }
        .prose p { margin-bottom: 1.25rem; line-height: 1.8; color: #4b5563; font-size: 1.125rem; }
        .prose ul { list-style-type: disc; padding-left: 1.5rem; margin-bottom: 1.5rem; color: #4b5563; font-size: 1.125rem; }
        .prose ol { list-style-type: decimal; padding-left: 1.5rem; margin-bottom: 1.5rem; color: #4b5563; font-size: 1.125rem; }
        .prose li { margin-bottom: 0.5rem; }
        .prose strong { color: #111827; font-weight: 600; }
        .prose a { color: #4f46e5; text-decoration: underline; }
        .prose blockquote { border-left: 4px solid #e5e7eb; padding-left: 1rem; font-style: italic; color: #6b7280; margin-bottom: 1.5rem; }
    </style>
</head>
<body class="bg-gray-50 font-sans min-h-screen pb-16">

    <!-- Navbar cho trang đọc báo -->
    <header class="bg-white shadow-sm sticky top-0 z-40 mb-8">
        <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center h-16">
                <a href="javascript:window.close();" class="text-gray-500 hover:text-indigo-600 flex items-center gap-2 transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                    Đóng trang
                </a>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 bg-white p-8 sm:p-12 rounded-2xl shadow-sm border border-gray-100">
        
        <!-- Khu vực hiển thị Tags & Tiêu đề -->
        <div class="border-b border-gray-100 pb-8 mb-8">
            <div id="post-tags" class="flex flex-wrap gap-2 mb-4">
                <!-- Tags sẽ render tại đây -->
            </div>
            <h1 id="post-title" class="text-3xl sm:text-4xl font-extrabold text-gray-900 leading-tight">
                Đang tải dữ liệu...
            </h1>
        </div>

        <!-- Khu vực hiển thị Nội dung HTML AI -->
        <article id="post-content" class="prose max-w-none">
            <!-- Nội dung bài blog từ html_content -->
            <div class="animate-pulse flex space-x-4 mt-8">
                <div class="flex-1 space-y-4 py-1">
                  <div class="h-4 bg-gray-200 rounded w-3/4"></div>
                  <div class="space-y-2">
                    <div class="h-4 bg-gray-200 rounded"></div>
                    <div class="h-4 bg-gray-200 rounded w-5/6"></div>
                  </div>
                </div>
            </div>
        </article>

    </main>

    <script>
        // Khi trang HTML phụ này load lên, nó sẽ đọc dữ liệu đang giấu trong SessionStorage
        document.addEventListener('DOMContentLoaded', () => {
            const rawData = sessionStorage.getItem('current_view_post');
            
            if (rawData) {
                const postData = JSON.parse(rawData);
                
                // Đẩy dữ liệu lên giao diện
                document.getElementById('page-title').textContent = postData.title + " | AI Blog";
                document.getElementById('post-title').textContent = postData.title;
                document.getElementById('post-content').innerHTML = postData.content;
                
                // Xử lý Tags
                if (postData.tags && Array.isArray(postData.tags)) {
                    const tagsHtml = postData.tags.map(tag => 
                        `<span class="px-3 py-1 text-sm font-medium bg-indigo-50 text-indigo-700 rounded-full">#${tag}</span>`
                    ).join('');
                    document.getElementById('post-tags').innerHTML = tagsHtml;
                }
            } else {
                document.getElementById('post-title').textContent = "Không tìm thấy bài viết";
                document.getElementById('post-content').innerHTML = "<p>Lỗi: Không có dữ liệu bài viết được truyền tới trang này. Vui lòng mở lại bài viết từ trang chủ.</p>";
            }
        });
    </script>
</body>
</html>
